
# Autenticacion selectiva de la API:
# GET /api/reserves requiere contraseña.
# PUT y DELETE /api/reserves/:id requieren contraseña.
# POST /api/reserves y POST /api/chat siguen siendo publicos.

map "$request_method:$uri" $api_auth_realm {
    default off;
    "GET:/api/reserves" "Administracion";
    ~^(PUT|DELETE):/api/reserves/[^/]+$ "Administracion";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Web principal
    location / {
        try_files $uri $uri/ =404;
    }

    # API: Nginx envia las peticiones al backend
    location /api/ {
        proxy_pass http://backend:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proteccion de las operaciones de gestion
        auth_basic $api_auth_realm;
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # Panel de gestion protegido
    location /gestion/ {
        auth_basic "Zona de gestion";
        auth_basic_user_file /etc/nginx/.htpasswd;

        try_files $uri $uri/ =404;
    }

    # phpMyAdmin protegido
    location /phpmyadmin/ {
        auth_basic "Administracion de base de datos";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://phpmyadmin:80/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }
}


services:
  nginx:
    build: ./nginx
    ports:
      - "${APP_PORT:-8085}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - publica
      - privada
    restart: unless-stopped

  backend:
    profiles: ["taller"]
    build: ./backend
    environment:
      PORT: 3000
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?Define DB_NAME en .env}
      DB_USER: ${DB_USER:?Define DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      DEBUG_CHAT: ${DEBUG_CHAT:-false}
      TZ: Europe/Madrid
    networks:
      - publica
      - privada
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  mariadb:
    profiles: ["taller"]
    image: mariadb:11.4
    environment:
      TZ: Europe/Madrid
      MARIADB_DATABASE: ${DB_NAME:?Define DB_NAME en .env}
      MARIADB_USER: ${DB_USER:?Define DB_USER en .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
    volumes:
      - datos_mariadb:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - privada
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    profiles: ["taller"]
    image: phpmyadmin:5.2.2-apache
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI:-http://localhost:8085/phpmyadmin/}
    networks:
      - privada
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  backup:
    profiles: ["taller"]
    image: mariadb:11.4
    command: ["sh", "/scripts/backup.sh"]
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?Define DB_NAME en .env}
      DB_USER: ${DB_USER:?Define DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      TZ: Europe/Madrid
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    networks:
      - privada
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  datos_mariadb:

networks:
  publica:
  privada:
    internal: true
